name: Dailer X Android CI

on:
  push:
    paths:
      - "dailer-x/android/**"
      - "dailer-x/backend/**"
      - "dailer-x/scripts/**"
      - "dailer-x/build.gradle.kts"
      - "dailer-x/settings.gradle.kts"
      - "dailer-x/gradle.properties"
      - "dailer-x/docker-compose.yml"
      - "dailer-x/Dockerfile.debian"
      - "dailer-x/.github/workflows/**"
      - ".github/workflows/dailer-x-ci.yml"
  pull_request:
    paths:
      - "dailer-x/**"
      - ".github/workflows/dailer-x-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dailer-x

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dailer-x/backend/requirements.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Test backend
        env:
          DAILERX_REPORT_SALT: ci-test-salt
        run: python -m pytest -q backend/tests

      - name: Compile Android debug APK
        run: gradle --no-daemon --stacktrace :android:app:assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dailer-x-debug-apk
          path: dailer-x/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
