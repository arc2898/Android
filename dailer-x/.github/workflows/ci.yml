name: Dailer X CI

on:
  push:
    paths:
      - "dailer-x/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "dailer-x/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dailer-x
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dailer-x/backend/requirements.txt

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Test backend
        env:
          DAILERX_REPORT_SALT: ci-test-salt
        run: python -m pytest -q backend/tests

      - name: Build Android debug APK
        run: gradle --no-daemon --stacktrace :android:app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dailer-x-debug-apk
          path: dailer-x/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
