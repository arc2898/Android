services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DAILERX_DB: /data/dailerx.db
      # Business imports are disabled unless a strong secret is configured.
      DAILERX_ADMIN_KEY: ${DAILERX_ADMIN_KEY:-}
      # Set a persistent random value for deployments; don't use this development default in production.
      DAILERX_REPORT_SALT: ${DAILERX_REPORT_SALT:-local-development-only-change-me}
    volumes:
      - dailerx_data:/data
    restart: unless-stopped
volumes:
  dailerx_data:
